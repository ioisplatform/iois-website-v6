<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Professional Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-950 text-white font-sans">

    <!-- 1. LOGIN SECTION -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-sm border border-gray-800 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">IOIS LOGIN</h2>
            <input id="user-name" type="text" placeholder="अपना नाम लिखें" class="w-full p-3 mb-4 rounded-xl bg-gray-800 border border-gray-700">
            <button onclick="loginUser()" class="w-full bg-amber-500 py-3 rounded-xl font-bold text-black">LOGIN</button>
        </div>
    </div>

    <!-- 2. DASHBOARD SECTION (HIDDEN BY DEFAULT) -->
    <div id="dashboard-section" class="hidden p-4 max-w-lg mx-auto">
        <!-- User Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-lg font-bold">नमस्ते, <span id="display-name" class="text-amber-400"></span></h1>
            <button onclick="logout()" class="text-xs bg-red-900 px-3 py-1 rounded">Logout</button>
        </div>

        <!-- Wallet Card -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 rounded-3xl mb-6 shadow-xl">
            <p class="text-xs text-blue-200">Total Balance</p>
            <h2 class="text-4xl font-black">₹<span id="user-balance">0.00</span></h2>
        </div>

        <!-- Action Grid -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="showSection('earn')" class="bg-gray-800 p-4 rounded-2xl">अर्निंग करें</button>
            <button onclick="showSection('profile')" class="bg-gray-800 p-4 rounded-2xl">प्रोफाइल</button>
        </div>
    </div>

    <script>
        // LOGIN LOGIC
        function loginUser() {
            const name = document.getElementById('user-name').value;
            if(name) {
                localStorage.setItem('ioisUser', name);
                showDashboard();
            } else {
                alert("कृपया अपना नाम लिखें!");
            }
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('display-name').innerText = localStorage.getItem('ioisUser');
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // AUTO-CHECK LOGIN
        window.onload = () => {
            if(localStorage.getItem('ioisUser')) showDashboard();
        }
    </script>
</body>
</html>
