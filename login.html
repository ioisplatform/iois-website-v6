<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Platform - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-text">IOIS PLATFORM</div>
        <p>Member Login</p>
    </header>

    <nav>
        <a href="index.html">🏠 होम</a>
        <a href="register.html">📝 रजिस्ट्रेशन</a>
        <a href="login.html" class="active">🔑 लॉगिन</a>
        <a href="dashboard.html">📊 डैशबोर्ड</a>
        <a href="admin.html" style="background:#dc3545;">🛡️ एडमिन पैनल</a>
    </nav>

    <div class="container" style="max-width: 450px;">
        <h2>🔑 मेंबर लॉगिन</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="form-group">
                <label>यूजर आईडी (User ID)</label>
                <input type="text" id="loginId" placeholder="जैसे: IOIS123456" required>
            </div>

            <div class="form-group">
                <label>पासवर्ड (Password)</label>
                <input type="password" id="loginPass" placeholder="अपना पासवर्ड दर्ज करें" required>
            </div>

            <button type="submit">लॉगिन करें</button>

            <div style="margin-top: 15px; text-align: center;">
                <a href="#" onclick="recoverAccount()" style="color: #ff9933; font-size: 14px; text-decoration: none;">🔍 यूजर आईडी / पासवर्ड भूल गए? यहाँ क्लिक करें</a>
            </div>
        </form>
    </div>

    <footer>
        <p>Official WhatsApp: +91 8877490845</p>
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            const storedUser = localStorage.getItem(id);
            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user.password === pass) {
                    localStorage.setItem('currentUser', id);
                    alert('लॉगिन सफल रहा!');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('गलत पासवर्ड!');
                }
            } else {
                alert('यह यूजर आईडी नहीं मिली!');
            }
        }

        // वेबसाइट से ही सीधे आईडी और पासवर्ड रिकवर करने का फीचर
        function recoverAccount() {
            const wh = prompt("अपना रजिस्टर किया हुआ 10 अंकों का व्हाट्सएप नंबर दर्ज करें:");
            if(!wh) return;
            
            let found = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if(key.startsWith('IOIS')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if(data.whatsapp === wh) {
                        alert(`✅ आपकी जानकारी मिल गई!\n\nUser ID: ${data.userId}\nPassword: ${data.password}\nName: ${data.fullName}`);
                        found = true;
                        break;
                    }
                }
            }
            if(!found) {
                alert('इस व्हाट्सएप नंबर से कोई अकाउंट नहीं मिला!');
            }
        }
    </script>
</body>
</html>
