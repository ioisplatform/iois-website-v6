<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन - IOIS Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0f19; color: #fff; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding-bottom: 80px; }

        .container { 
            width: 100%;
            max-width: 420px; 
            background: linear-gradient(135deg, #0f172a, #1e1b4b); 
            border: 2px solid #fbbf24; 
            border-radius: 20px; 
            padding: 22px; 
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(251,191,36,0.2); 
        }

        .brand-header { text-align: center; margin-bottom: 15px; }
        .logo-wrapper {
            display: inline-block;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.3));
            border: 2.5px solid #fbbf24;
            padding: 8px 20px;
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }
        .logo-main-text { 
            background: linear-gradient(135deg, #ff9933 0%, #ffffff 50%, #138808 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 18px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; 
        }
        .logo-sub-text { font-size: 8px; color: #38bdf8; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; font-weight: 700; }

        .main-heading { text-align: center; color: #fbbf24; font-size: 18px; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; }
        .sub-heading { text-align: center; color: #94a3b8; font-size: 11.5px; margin-bottom: 20px; font-weight: 500; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #38bdf8; font-weight: 700; margin-bottom: 5px; }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .form-group input:focus {
            border-color: #fbbf24;
            outline: none;
            box-shadow: 0 0 8px rgba(251,191,36,0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            font-weight: 900;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(251,191,36,0.4);
            margin-top: 10px;
        }
        .btn-login:hover { background: #f59e0b; }

        .register-link { text-align: center; margin-top: 18px; font-size: 12px; }
        .register-link a { color: #38bdf8; text-decoration: none; font-weight: 700; }

        /* Floating Bottom Navigation Bar */
        .floating-bottom-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(251, 191, 36, 0.3);
            display: flex;
            justify-content: space-around;
            padding: 8px 6px;
            z-index: 9999;
        }
        .float-nav-btn {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
        }
        .float-nav-btn.gold { border-color: #fbbf24; color: #fbbf24; background: rgba(251,191,36,0.1); }
    </style>
</head>
<body>

    <div class="floating-bottom-bar">
        <a href="index.html" class="float-nav-btn gold">🏠 होम पेज</a>
        <a href="register.html" class="float-nav-btn">📝 रजिस्ट्रेशन</a>
        <a href="https://wa.me/918877490845?text=Hello%20IOIS%20Support" target="_blank" class="float-nav-btn" style="border-color: #22c55e; color: #4ade80;">💬 सपोर्ट</a>
    </div>

    <div class="container">
        
        <div class="brand-header">
            <div class="logo-wrapper">
                <div class="logo-main-text">IOIS PLATFORM</div>
                <div class="logo-sub-text">Indian Online Income Supporting System</div>
            </div>
        </div>

        <div class="main-heading">🔑 सदस्य लॉगिन</div>
        <div class="sub-heading">अपने व्हाट्सएप नंबर और पासवर्ड से लॉगिन करें।</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            
            <div class="form-group">
                <label>व्हाट्सएप नंबर (WhatsApp Number / ID)</label>
                <input type="tel" id="loginWhatsapp" required placeholder="अपना 10 अंकों का मोबाइल नंबर दर्ज करें">
            </div>

            <div class="form-group">
                <label>पासवर्ड (Password)</label>
                <input type="password" id="loginPassword" required placeholder="अपना पासवर्ड दर्ज करें">
            </div>

            <button type="submit" class="btn-login">लॉगिन करें ➔</button>
        </form>

        <div class="register-link">
            नया अकाउंट बनाना है? <a href="register.html">रजिस्ट्रेशन करें</a>
        </div>

    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const whatsapp = document.getElementById('loginWhatsapp').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            // स्पेशल ओनर लॉगिन चेक (यदि ओनर सीधे 'ioisowner' या अपने नंबर से लॉगिन करे)
            if (whatsapp.toLowerCase() === 'ioisowner' || whatsapp === '8877490845') {
                localStorage.setItem('currentUser', 'ioisowner');
                alert('स्वागत है ओनर जी! आपको एडमिन पैनल पर ले जाया जा रहा है।');
                window.location.href = 'admin.html';
                return;
            }

            // लोकल स्टोरेज से यूजर डेटा चेक करना
            const savedUserJson = localStorage.getItem('user_' + whatsapp);

            if (savedUserJson) {
                const userData = JSON.parse(savedUserJson);
                if (userData.password === password) {
                    localStorage.setItem('currentUser', whatsapp);
                    alert('लॉगिन सफल! डैशबोर्ड पर रीडायरेक्ट किया जा रहा है।');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('गलत पासवर्ड! कृपया सही पासवर्ड दर्ज करें।');
                }
            } else {
                alert('यह व्हाट्सएप नंबर रजिस्टर नहीं है! कृपया पहले रजिस्ट्रेशन करें।');
                window.location.href = 'register.html';
            }
        }
    </script>
</body>
</html>
