<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS - INDIAN ONLINE INCOME SUPPORTING SYSTEM</title>
    <!-- ब्राउज़र टैब के लिए लोगो (Favicon) -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            /* कमरे की दीवार जैसा प्रीमियम बैकग्राउंड लुक */
            background: linear-gradient(135deg, #1b263b, #0d1b2a);
            color: #f8f9fa; 
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .room-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* हेडर और लोगो स्टाइल */
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(20, 30, 48, 0.8);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #f1c40f;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .brand-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #f1c40f;
            object-fit: cover;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(241, 196, 15, 0.4);
        }
        .brand-header h1 {
            font-size: 13px;
            font-weight: 900;
            color: #f1c40f;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* दीवार की घड़ी और डिजिटल घड़ी का सेक्शन */
        .wall-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }
        
        /* एनालॉग दीवार घड़ी */
        .analog-clock {
            width: 65px; height: 65px; border: 4px solid #f1c40f; border-radius: 50%;
            position: relative; background: #fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .hand {
            position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #000; border-radius: 4px;
        }
        .hour-hand { width: 3px; height: 16px; background: #333; transform: translateX(-50%); }
        .minute-hand { width: 2px; height: 22px; background: #555; transform: translateX(-50%); }
        .second-hand { width: 1px; height: 26px; background: #e74c3c; transform: translateX(-50%); }
        .center-dot { width: 6px; height: 6px; background: #f1c40f; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .digital-clock-box {
            text-align: right;
        }
        .digital-clock { font-size: 20px; font-weight: bold; color: #f1c40f; font-family: monospace; }
        .clock-label { font-size: 9px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; }

        /* खिड़की जैसी आइकॉन (लाइव मौसम) */
        .window-weather {
            width: 100%;
            height: 100px;
            border: 6px solid #4a5568;
            border-radius: 18px;
            background: linear-gradient(to bottom, #38bdf8, #bae6fd);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.3);
            color: #0f172a;
            position: relative;
            overflow: hidden;
        }
        .window-frame-line {
            position: absolute; width: 100%; height: 2px; background: #4a5568; top: 50%;
        }
        .weather-info {
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .weather-sub { font-size: 10px; font-weight: 700; color: #334155; margin-top: 2px; z-index: 2; }

        /* मोबाइल होम स्क्रीन ऐप आइकॉन ग्रिड */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s;
        }
        .app-icon:active { transform: scale(0.95); }
        
        .icon-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 1px solid rgba(241, 196, 15, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 6px;
        }
        .icon-label { 
            font-size: 11px; 
            font-weight: 600; 
            text-align: center; 
            color: #cbd5e1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="room-container">
        
        <!-- ब्रैंडेड हेडर और लोगो (फोटोज जैसी हाई क्वालिटी गोल्ड थीम) -->
        <div class="brand-header">
            <img src="logo.png" alt="IOIS Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/70?text=IOIS'">
            <h1>IOIS - INDIAN ONLINE INCOME SUPPORTING SYSTEM</h1>
        </div>

        <!-- दीवार वाली एनालॉग घड़ी और डिजिटल घड़ी -->
        <div class="wall-display">
            <div class="analog-clock">
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
                <div class="center-dot"></div>
            </div>
            <div class="digital-clock-box">
                <div class="digital-clock" id="digitalClock">00:00:00</div>
                <div class="clock-label">लाइव डिजिटल घड़ी</div>
            </div>
        </div>
        
        <!-- खिड़की जैसी डिजाइन वाला लाइव मौसम विजेट -->
        <div class="window-weather" id="weatherWidget">
            <div class="window-frame-line"></div>
            <div class="weather-info" id="tempText">मौसम लोड हो रहा है...</div>
            <div class="weather-sub" id="cityText">GPS लोकेशन</div>
        </div>

        <!-- मोबाइल होम स्क्रीन जैसे ऐप आइकॉन (सभी जरूरी पेजों के लिए) -->
        <div class="app-grid">
            <a href="dashboard.html" class="app-icon">
                <div class="icon-box">📊</div>
                <div class="icon-label">डैशबोर्ड</div>
            </a>
            <a href="jobs.html" class="app-icon">
                <div class="icon-box">💼</div>
                <div class="icon-label">जॉब्स पोर्टल</div>
            </a>
            <a href="news.html" class="app-icon">
                <div class="icon-box">📰</div>
                <div class="icon-label">दैनिक न्यूज़</div>
            </a>
            <a href="utilities.html" class="app-icon">
                <div class="icon-box">📅</div>
                <div class="icon-label">पंचांग व राशिफल</div>
            </a>
            <a href="chat.html" class="app-icon">
                <div class="icon-box">💬</div>
                <div class="icon-label">कम्युनिटी चैट</div>
            </a>
            <a href="register.html" class="app-icon">
                <div class="icon-box" style="border-color: #22c55e;">🚀</div>
                <div class="icon-label" style="color: #22c55e;">रजिस्टर</div>
            </a>
            <a href="login.html" class="app-icon">
                <div class="icon-box">🔑</div>
                <div class="icon-label">लॉगिन</div>
            </a>
            <a href="admin.html" class="app-icon">
                <div class="icon-box" style="border-color: #e74c3c;">🛡️</div>
                <div class="icon-label">एडमिन पैनल</div>
            </a>
            <a href="utilities.html" class="app-icon">
                <div class="icon-box">⚙️</div>
                <div class="icon-label">अन्य सेवाएं</div>
            </a>
        </div>
    </div>
    
    <script>
        // घड़ी को चलाने का जावास्क्रिप्ट कोड (एनालॉग और डिजिटल दोनों)
        setInterval(() => {
            const now = new Date();
            
            // डिजिटल घड़ी अपडेट
            document.getElementById('digitalClock').innerText = now.toLocaleTimeString('hi-IN');

            // एनालॉग घड़ी की सुइयां घुमाना
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const secondDeg = (seconds / 60) * 360;
            const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
            const hourDeg = ((hours % 12 + minutes / 60) / 12) * 360;

            document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
        }, 1000);

        // लाइव GPS मौसम और शहर का नाम फेच करने का कोड
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        // Open-Meteo वेदर एपीआई
                        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const weatherData = await weatherRes.json();
                        
                        if (weatherData && weatherData.current_weather) {
                            const temp = weatherData.current_weather.temperature;
                            
                            // Nominatim से शहर का नाम पाना
                            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                                .then(res => res.json())
                                .then(locData => {
                                    let cityName = "आपका क्षेत्र";
                                    if (locData && locData.address) {
                                        cityName = locData.address.city || locData.address.town || locData.address.village || locData.address.county || "लाइव लोकेशन";
                                    }
                                    document.getElementById('tempText').innerText = `${temp}°C | साफ मौसम`;
                                    document.getElementById('cityText').innerText = cityName;
                                })
                                .catch(() => {
                                    document.getElementById('tempText').innerText = `${temp}°C तापमान`;
                                    document.getElementById('cityText').innerText = "लाइव मौसम (GPS)";
                                });
                        }
                    } catch (err) {
                        document.getElementById('tempText').innerText = "मौसम लोड नहीं हुआ";
                    }
                },
                (error) => {
                    document.getElementById('tempText').innerText = "लोकेशन अनुमति दें";
                    document.getElementById('cityText').innerText = "GPS बंद है";
                }
            );
        } else {
            document.getElementById('tempText').innerText = "GPS समर्थित नहीं";
        }
    </script>
</body>
</html>
