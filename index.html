<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS - INDIAN ONLINE INCOME SUPPORTING SYSTEM</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff; 
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .room-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* लोगो और ब्रांडेड हेडर */
        .brand-header {
            text-align: center;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px;
            border-radius: 16px;
            border: 2px solid #fbbf24;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .brand-logo {
            width: 65px; height: 65px; border-radius: 50%;
            border: 2px solid #fbbf24; object-fit: cover; margin-bottom: 6px;
        }
        .brand-header h1 {
            font-size: 11.5px; font-weight: 900; color: #fbbf24; text-transform: uppercase;
        }

        /* घड़ी सेक्शन */
        .wall-display {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; background: rgba(255, 255, 255, 0.05);
            padding: 10px 18px; border-radius: 16px; margin-bottom: 15px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .analog-clock {
            width: 65px; height: 65px; border: 4px solid #fbbf24; border-radius: 50%;
            position: relative; background: #fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .clock-number { position: absolute; font-size: 9px; font-weight: 900; color: #000; }
        .n12 { top: 2px; left: 27px; } .n3 { top: 25px; right: 4px; } .n6 { bottom: 2px; left: 29px; } .n9 { top: 25px; left: 4px; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #000; border-radius: 4px; }
        .hour-hand { width: 3px; height: 15px; background: #222; transform: translateX(-50%); }
        .minute-hand { width: 2px; height: 20px; background: #444; transform: translateX(-50%); }
        .second-hand { width: 1px; height: 24px; background: #ef4444; transform: translateX(-50%); }
        .center-dot { width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .digital-clock-box { text-align: right; }
        .digital-clock { font-size: 18px; font-weight: bold; color: #fbbf24; font-family: monospace; }
        .clock-label { font-size: 9px; color: #cbd5e1; text-transform: uppercase; }

        /* शहर सर्च बॉक्स */
        .city-search-box { display: flex; gap: 8px; width: 100%; margin-bottom: 15px; }
        .city-search-box input {
            flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #fbbf24;
            background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 13px; outline: none;
        }
        .city-search-box button {
            background: #fbbf24; color: #000; border: none; padding: 0 16px;
            border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 12px;
        }

        /* खुली खिड़की (जिसका बैकग्राउंड मौसम के हिसाब से बिल्कुल साफ दिखेगा) */
        .open-window {
            width: 100%;
            height: 130px;
            border: 8px solid #475569;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            transition: 0.5s background;
        }
        /* खिड़की की ग्रिल/फ्रेम लाइन्स */
        .window-grid-v { position: absolute; width: 3px; height: 100%; background: #475569; left: 50%; z-index: 2; }
        .window-grid-h { position: absolute; width: 100%; height: 3px; background: #475569; top: 50%; z-index: 2; }
        
        .weather-status-tag {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #fbbf24;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 800;
            z-index: 3;
            color: #fff;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* ऐप आइकॉन ग्रिड */
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; }
        .app-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; }
        .icon-box {
            width: 65px; height: 65px; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px); border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 26px; border: 1px solid rgba(251, 191, 36, 0.4); box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            margin-bottom: 5px;
        }
        .icon-label { font-size: 11px; font-weight: 600; text-align: center; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="room-container">
        
        <div class="brand-header">
            <img src="logo.png" alt="IOIS Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/65?text=IOIS'">
            <h1>IOIS - INDIAN ONLINE INCOME SUPPORTING SYSTEM</h1>
        </div>

        <div class="wall-display">
            <div class="analog-clock">
                <span class="clock-number n12">12</span>
                <span class="clock-number n3">3</span>
                <span class="clock-number n6">6</span>
                <span class="clock-number n9">9</span>
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
                <div class="center-dot"></div>
            </div>
            <div class="digital-clock-box">
                <div class="digital-clock" id="digitalClock">00:00:00</div>
                <div class="clock-label">लाइव घड़ी</div>
            </div>
        </div>

        <div class="city-search-box">
            <input type="text" id="cityInput" placeholder="अपना शहर/गाँव लिखें (जैसे: Patna)...">
            <button onclick="getWeather()">देखें</button>
        </div>
        
        <!-- खुली खिड़की: मौसम बदलते ही खिड़की के बाहर का नजारा बदल जाएगा -->
        <div class="open-window" id="windowView" style="background: linear-gradient(to bottom, #38bdf8, #bae6fd);">
            <div class="window-grid-v"></div>
            <div class="window-grid-h"></div>
            <div class="weather-status-tag" id="weatherText">मौसम लोड हो रहा है...</div>
        </div>

        <div class="app-grid">
            <a href="plans.html" class="app-icon">
                <div class="icon-box" style="border-color:#22c55e;">💰</div>
                <div class="icon-label">प्लान्स & 7 लेवल्स</div>
            </a>
            <a href="utilities.html" class="app-icon">
                <div class="icon-box">✨</div>
                <div class="icon-label">पंचांग व राशिफल</div>
            </a>
            <a href="news.html" class="app-icon">
                <div class="icon-box">📰</div>
                <div class="icon-label">ताजा जानकारी</div>
            </a>
            <a href="dashboard.html" class="app-icon">
                <div class="icon-box">📊</div>
                <div class="icon-label">डैशबोर्ड</div>
            </a>
            <a href="jobs.html" class="app-icon">
                <div class="icon-box">💼</div>
                <div class="icon-label">जॉब पोर्टल</div>
            </a>
            <a href="chat.html" class="app-icon">
                <div class="icon-box">💬</div>
                <div class="icon-label">चैट रूम</div>
            </a>
            <a href="register.html" class="app-icon">
                <div class="icon-box" style="border-color:#38bdf8;">🚀</div>
                <div class="icon-label">रजिस्टर</div>
            </a>
            <a href="login.html" class="app-icon">
                <div class="icon-box">🔑</div>
                <div class="icon-label">लॉगिन</div>
            </a>
            <a href="admin.html" class="app-icon">
                <div class="icon-box" style="border-color:#ef4444;">🛡️</div>
                <div class="icon-label">एडमिन पैनल</div>
            </a>
        </div>
    </div>
    
    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('digitalClock').innerText = now.toLocaleTimeString('hi-IN');
            const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${(s/60)*360}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${(m/60)*360}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${((h + m/60)/12)*360}deg)`;
        }, 1000);

        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim() || "Patna";
            const textTag = document.getElementById('weatherText');
            const windowBox = document.getElementById('windowView');
            
            textTag.innerHTML = "मौसम की जाँच हो रही है...";
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                const geoData = await geoRes.json();
                if(!geoData.results) {
                    textTag.innerHTML = "शहर नहीं मिला!";
                    return;
                }
                const { latitude, longitude, name } = geoData.results[0];
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const weatherData = await weatherRes.json();
                
                const temp = weatherData.current_weather.temperature;
                const code = weatherData.current_weather.weathercode;

                let condition = "साफ धूप ☀️";
                let windowBg = "linear-gradient(to bottom, #38bdf8, #bae6fd)"; // नीला आसमान (धूप)

                if (code >= 51 && code <= 67) {
                    condition = "मूसलाधार बारिश 🌧️";
                    windowBg = "linear-gradient(to bottom, #334155, #64748b)"; // मटमैला बारिश वाला आसमान
                } else if (code >= 1 && code <= 3) {
                    condition = "आसमान में बादल ⛅";
                    windowBg = "linear-gradient(to bottom, #64748b, #94a3b8)"; // बादलों वाला ग्रे आसमान
                } else if (code >= 71) {
                    condition = "बर्फबारी ❄️";
                    windowBg = "linear-gradient(to bottom, #cbd5e1, #f1f5f9)";
                }

                windowBox.style.background = windowBg;
                textTag.innerHTML = `📍 ${name} : ${temp}°C | ${condition}`;
            } catch(e) {
                textTag.innerHTML = "मौसम लोड करने में त्रुटि";
            }
        }
        window.onload = () => { getWeather(); };
    </script>
</body>
</html>
