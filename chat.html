<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कम्युनिटी चैट - IOIS Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background: #14161f; padding: 12px 20px; display: flex; justify-content: space-between; border-bottom: 3px solid #fbbf24; }
        .chat-container { flex: 1; max-width: 700px; width: 100%; margin: 10px auto; display: flex; flex-direction: column; padding: 10px; }
        .chat-box { flex: 1; background: #1e293b; border: 1px solid #38bdf8; border-radius: 10px; padding: 15px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .message { background: #0f172a; padding: 8px 12px; border-radius: 8px; font-size: 13px; border-left: 3px solid #fbbf24; }
        .message b { color: #38bdf8; display: block; font-size: 11px; margin-bottom: 2px; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #fbbf24; background: #1e293b; color: #fff; }
        .chat-input-area button { background: #22c55e; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" style="color:#fbbf24; font-weight:900; text-decoration:none;">💬 IOIS कम्युनिटी चैट रूम</a>
        <a href="dashboard.html" style="color:#38bdf8; font-size:12px; font-weight:bold; text-decoration:none;">👤 डैशबोर्ड</a>
    </header>

    <div class="chat-container">
        <div class="chat-box" id="chatMessages">
            <div class="message"><b>सिस्टम एडमिन</b>IOIS चैट रूम में आपका स्वागत है! अपनी बात मर्यादित और सम्मानजनक तरीके से रखें।</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="अपना संदेश यहाँ लिखें...">
            <button onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            
            const chatBox = document.getElementById('chatMessages');
            const currentUser = localStorage.getItem('currentUser') || 'सक्रिय सदस्य';
            
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<b>${currentUser}</b>${input.value}`;
            chatBox.appendChild(div);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
