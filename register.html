<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रजिस्ट्रेशन व पेमेंट - IOIS Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0f19; color: #fff; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding-bottom: 80px; }

        .container { 
            width: 100%; max-width: 460px; background: linear-gradient(135deg, #0f172a, #1e1b4b); 
            border: 2px solid #fbbf24; border-radius: 20px; padding: 20px; 
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(251,191,36,0.2); 
        }
        .brand-header { text-align: center; margin-bottom: 12px; }
        .logo-wrapper {
            display: inline-block; background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.3));
            border: 2.5px solid #fbbf24; padding: 8px 20px; border-radius: 40px;
        }
        .logo-main-text { 
            background: linear-gradient(135deg, #ff9933 0%, #ffffff 50%, #138808 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 18px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; 
        }
        .main-heading { text-align: center; color: #fbbf24; font-size: 18px; font-weight: 800; margin-bottom: 10px; }

        .qr-box {
            background: rgba(15, 23, 42, 0.95); border: 1.5px dashed #fbbf24; border-radius: 10px;
            padding: 15px; text-align: center; margin-bottom: 20px;
        }
        .qr-box p { font-size: 13px; color: #38bdf8; margin-bottom: 8px; font-weight: bold; }
        .upi-id-badge { 
            background: #1e293b; color: #fbbf24; padding: 8px; border-radius: 5px; 
            font-size: 14px; font-weight: bold; display: block; border: 1px solid #fbbf24; word-break: break-all;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #38bdf8; font-weight: 700; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(251, 191, 36, 0.4); border-radius: 8px; color: #fff; font-size: 13px;
        }
        .btn-register {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; font-weight: 800;
            padding: 12px; border: none; width: 100%; border-radius: 10px; cursor: pointer;
            text-transform: uppercase; margin-top: 10px;
        }
        .floating-bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px); border-top: 1px solid rgba(251, 191, 36, 0.3);
            display: flex; justify-content: space-around; padding: 8px; z-index: 9999;
        }
        .float-nav-btn {
            background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8;
            padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-decoration: none;
        }
        .float-nav-btn.gold { border-color: #fbbf24; color: #fbbf24; }
    </style>
</head>
<body>

    <div class="floating-bottom-bar">
        <a href="index.html" class="float-nav-btn gold">🏠 होम</a>
        <a href="login.html" class="float-nav-btn">🔑 लॉगिन</a>
        <a href="https://wa.me/918877490845?text=Hello%20Support" target="_blank" class="float-nav-btn" style="border-color: #22c55e; color: #4ade80;">💬 सपोर्ट</a>
    </div>

    <div class="container">
        <div class="brand-header">
            <div class="logo-wrapper"><div class="logo-main-text">IOIS PLATFORM</div></div>
        </div>

        <div class="main-heading">📝 नया रजिस्ट्रेशन व पेमेंट</div>

        <div class="qr-box">
            <p>👇 पेमेंट के लिए सही UPI ID:</p>
            <div class="upi-id-badge">8877490845@spicepay</div>
            <p style="font-size: 10px; margin-top: 10px; color: #fbbf24;">(पेमेंट के बाद UTR/ट्रांजैक्शन ID और स्क्रीनशॉट ज़रूर दें)</p>
        </div>

        <form id="registerForm" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label>पूरा नाम</label>
                <input type="text" id="fullName" required placeholder="अपना नाम लिखें">
            </div>
            <div class="form-group">
                <label>व्हाट्सएप नंबर (लॉगिन आईडी)</label>
                <input type="tel" id="whatsapp" required placeholder="10 अंकों का नंबर">
            </div>
            <div class="form-group">
                <label>पासवर्ड</label>
                <input type="password" id="password" required placeholder="पासवर्ड बनाएं">
            </div>
            <div class="form-group">
                <label>चुना गया प्लान</label>
                <select id="selectedPlan">
                    <option value="Digital Starter Kit (₹10)">Digital Starter Kit - ₹10</option>
                    <option value="Pro Elite Pass (₹49)">Pro Elite Pass - ₹49</option>
                </select>
            </div>
            <div class="form-group">
                <label>UPI ट्रांजैक्शन ID / UTR Number</label>
                <input type="text" id="utrNumber" required placeholder="12 अंकों का UTR नंबर">
            </div>
            <div class="form-group">
                <label>पेमेंट का स्क्रीनशॉट</label>
                <input type="file" id="paymentProof" accept="image/*" required>
            </div>
            <button type="submit" class="btn-register">सबमिट करें ➔</button>
        </form>
    </div>

    <script>
        function handleRegistration(event) {
            event.preventDefault();
            const name = document.getElementById('fullName').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const password = document.getElementById('password').value.trim();
            const plan = document.getElementById('selectedPlan').value;
            const utr = document.getElementById('utrNumber').value.trim();
            const joinDate = new Date().toLocaleDateString('hi-IN');

            const fileInput = document.getElementById('paymentProof');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const userData = {
                        name, whatsapp, password, plan, utr,
                        paymentProof: e.target.result,
                        joinDate, status: 'Pending Verification', earnings: 0
                    };
                    localStorage.setItem('user_' + whatsapp, JSON.stringify(userData));

                    let allUsers = JSON.parse(localStorage.getItem('iois_all_users') || '[]');
                    if (!allUsers.includes(whatsapp)) {
                        allUsers.push(whatsapp);
                        localStorage.setItem('iois_all_users', JSON.stringify(allUsers));
                    }

                    alert('रजिस्ट्रेशन सफल! एडमिन द्वारा पेमेंट वेरीफाई होने के बाद आपका अकाउंट एक्टिव हो जाएगा।');
                    window.location.href = 'login.html';
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
