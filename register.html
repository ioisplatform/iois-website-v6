<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Platform - Secure Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-text">IOIS PLATFORM</div>
        <p style="color: #aaa; font-size: 13px; margin-top: 5px;">Secure Registration Portal</p>
    </header>

    <nav>
        <a href="index.html">🏠 होम</a>
        <a href="register.html" class="active">📝 रजिस्ट्रेशन</a>
        <a href="login.html">🔑 लॉगिन</a>
        <a href="dashboard.html">📊 डैशबोर्ड</a>
        <a href="admin.html" style="background:#dc3545; color:#fff;">🛡️ एडमिन पैनल</a>
    </nav>

    <div class="container" style="max-width: 650px;">
        <h2>📝 नया सदस्य रजिस्ट्रेशन फॉर्म</h2>
        <form id="regForm" onsubmit="submitRegistration(event)">
            
            <div class="form-group">
                <label>अपना पसंदीदा प्लान चुनें (Select Plan Tier)</label>
                <select id="cardTier" required>
                    <option value="Tiranga Silver Card (₹10)">Tiranga Silver Card (₹10) - 7% Payout</option>
                    <option value="Pro Starter Pass (₹49)">Pro Starter Pass (₹49) - Basic Tools</option>
                    <option value="Executive Pass (₹99)">Executive Pass (₹99) - Standard Package</option>
                    <option value="Smart Agency Pass (₹199)">Smart Agency Pass (₹199) - Mid-Level Access</option>
                    <option value="Business Growth Pass (₹299)">Business Growth Pass (₹299) - Growth Toolkit</option>
                    <option value="Diamond Agency Pass (₹499)">Diamond Agency Pass (₹499) - Advanced Pass</option>
                    <option value="VIP Mastermind Pass (₹999)">VIP Mastermind Pass (₹999) - Ultimate Access</option>
                </select>
            </div>

            <div class="form-group">
                <label>पूरा नाम (Full Name)</label>
                <input type="text" id="fullName" placeholder="अपना पूरा नाम दर्ज करें" required>
            </div>

            <div class="form-group">
                <label>प्रोफाइल फोटो अपलोड करें (Profile Picture)</label>
                <input type="file" id="userPhoto" accept="image/*" required style="padding: 10px;">
            </div>

            <div class="form-group">
                <label>ईमेल आईडी (Email Address)</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>व्हाट्सएप नंबर (WhatsApp Number - 10 Digits)</label>
                <input type="tel" id="whatsapp" placeholder="अपना व्हाट्सएप नंबर दर्ज करें" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>स्पॉन्सर आईडी / रेफरल आईडी (Sponsor ID)</label>
                <input type="text" id="sponsorId" value="IOISPLATFORM" required>
            </div>

            <div class="form-group">
                <label>पेमेंट रिसीविंग जानकारी (खुद का या परिवार का UPI / Bank A/c + IFSC)</label>
                <input type="text" id="paymentInfo" placeholder="UPI ID या बैंक खाता विवरण दर्ज करें" required>
            </div>

            <div class="form-group">
                <label>सुरक्षित पासवर्ड बनाएं (Create Password)</label>
                <input type="password" id="password" placeholder="अपना मजबूत पासवर्ड बनाएं" required>
            </div>

            <button type="submit">सफलतापूर्वक रजिस्टर करें और ID प्राप्त करें</button>
        </form>
    </div>

    <footer>
        <p>Official WhatsApp: +91 8877490845 | 100% Trusted System</p>
    </footer>

    <script>
        function submitRegistration(event) {
            event.preventDefault();

            const photoInput = document.getElementById('userPhoto');
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processReg(e.target.result);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                processReg("");
            }
        }

        function processReg(photoData) {
            const userId = 'IOIS' + Math.floor(100000 + Math.random() * 900000);
            const joinDate = new Date().toLocaleString();
            
            const cardTier = document.getElementById('cardTier').value;
            const fullName = document.getElementById('fullName.value').value || document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const sponsorId = document.getElementById('sponsorId').value;
            const paymentInfo = document.getElementById('paymentInfo').value;
            const password = document.getElementById('password').value;

            const userData = { userId, fullName, email, whatsapp, sponsorId, paymentInfo, password, cardTier, joinDate, photo: photoData };
            
            localStorage.setItem(userId, JSON.stringify(userData));
            localStorage.setItem('currentUser', userId);

            // Telegram Bot Notification API
            const botToken = "8838741922:AAFGoIvjohnF8FvEiW84h3SxaX2NeANLC50";
            const chatId = "964524685";
            const message = `🔔 *New Trusted Registration!*\n🆔 ID: ${userId}\n👤 Name: ${fullName}\n📱 WhatsApp: ${whatsapp}\n📦 Plan: ${cardTier}`;
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`).catch(err=>console.log(err));

            alert(`🎉 बहुत-बधाई हो! आपका रजिस्ट्रेशन सफल रहा।\n\nआपकी यूनिक यूजर आईडी (इसे कॉपी कर लें):\n👉 ${userId}\n\nअब आपको आपके डैशबोर्ड पर ले जाया जा रहा है।`);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
