<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>मेरा डैशबोर्ड - IOIS Platform</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 15px; }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fbbf24; margin: 0 auto 15px; display: block; object-fit: cover; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #22c55e; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container" id="dashboardContent">
        <h2 style="text-align:center; color:#fbbf24;">नमस्ते, <span id="userNameDisplay"></span>!</h2>
        <img id="profilePreview" class="profile-pic" src="https://via.placeholder.com/120" alt="Profile">
        
        <div class="form-group">
            <label>प्रोफाइल फोटो बदलें:</label>
            <input type="file" id="profileImageInput" accept="image/*" onchange="uploadPhoto()">
        </div>

        <div class="form-group">
            <label>नाम:</label>
            <input type="text" id="editName">
        </div>

        <div class="form-group">
            <label>पेमेंट डिटेल्स (UPI/Bank):</label>
            <input type="text" id="editPayment">
        </div>

        <button onclick="saveProfile()">प्रोफाइल सुरक्षित करें</button>
        <button onclick="logout()" style="background:#dc3545;">लॉगआउट</button>
        
        <div id="adminPanelBtn" style="margin-top:20px; display:none;">
            <a href="admin.html" style="color:#fbbf24;">🛡️ एडमिन पैनल (सिर्फ ओनर के लिए)</a>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('currentUser');

        window.onload = () => {
            if (!currentUser) window.location.href = 'login.html';
            
            // ओनर चेक (ओनर को ही एडमिन पैनल बटन दिखेगा)
            if (currentUser === 'ioisowner') {
                document.getElementById('adminPanelBtn').style.display = 'block';
            }

            const userData = JSON.parse(localStorage.getItem('user_' + currentUser));
            document.getElementById('userNameDisplay').innerText = userData.name;
            document.getElementById('editName').value = userData.name;
            document.getElementById('editPayment').value = userData.payment;
            if(userData.photo) document.getElementById('profilePreview').src = userData.photo;
        };

        function uploadPhoto() {
            const file = document.getElementById('profileImageInput').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('profilePreview').src = e.target.result;
                let userData = JSON.parse(localStorage.getItem('user_' + currentUser));
                userData.photo = e.target.result;
                localStorage.setItem('user_' + currentUser, JSON.stringify(userData));
            };
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            let userData = JSON.parse(localStorage.getItem('user_' + currentUser));
            userData.name = document.getElementById('editName').value;
            userData.payment = document.getElementById('editPayment').value;
            localStorage.setItem('user_' + currentUser, JSON.stringify(userData));
            alert('प्रोफाइल अपडेट हो गई!');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
