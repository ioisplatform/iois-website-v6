<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Platform - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .id-card { background: linear-gradient(135deg, #111, #333); color: #fff; padding: 20px; border-radius: 10px; border: 2px solid #ff9933; margin-bottom: 20px; text-align: center; }
        .id-card img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #ff9933; margin-bottom: 10px; }
        .dash-box { background: #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">IOIS PLATFORM</div>
        <p>Member Dashboard</p>
    </header>

    <nav>
        <a href="index.html">🏠 होम</a>
        <a href="register.html">📝 रजिस्ट्रेशन</a>
        <a href="login.html">🔑 लॉगिन</a>
        <a href="dashboard.html" class="active">📊 डैशबोर्ड</a>
        <a href="admin.html" style="background:#dc3545;">🛡️ एडमिन पैनल</a>
    </nav>

    <div class="container" style="max-width: 700px;">
        
        <!-- यूनिक डिजिटल आईडी कार्ड (3D सिल्वर टेक्स्ट लुक) -->
        <div class="id-card">
            <img id="cardPhoto" src="" alt="Profile Photo" style="display:none;">
            <h3 style="background: linear-gradient(45deg, #silver, #fff, #ff9933); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">IOIS 3D DIGITAL ID CARD</h3>
            <p id="cardName" style="font-size: 20px; font-weight: bold; margin-top: 5px;"></p>
            <p id="cardId" style="color: #ff9933; font-weight: bold;"></p>
            <p id="cardPlan" style="font-size: 14px; color: #aaa;"></p>
        </div>

        <div class="dash-box">
            <p><strong>आपका यूनिक रेफरल लिंक:</strong></p>
            <input type="text" id="refLink" readonly style="margin-top: 5px; background: #fff;">
            <button onclick="copyLink()" style="margin-top: 10px; background: #ff9933; color: #000;">📋 लिंक कॉपी करें</button>
        </div>

        <!-- व्हाट्सएप शेयरिंग और यूनिक पोस्टर बैनर लिंक -->
        <div class="dash-box" style="background:#fff; border:1px solid #ddd;">
            <h3>⚡ व्हाट्सएप स्टेटस शेयरिंग</h3>
            <p style="margin-top: 5px; font-size: 14px;">एक क्लिक में अपने व्हाट्सएप स्टेटस पर IOIS का ऑफिशियल पोस्टर और रेफरल लिंक शेयर करें:</p>
            <a id="waShareBtn" href="#" target="_blank">
                <button style="background: #25d366; margin-top: 10px;">🟢 व्हाट्सएप स्टेटस पर शेयर करें</button>
            </a>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button onclick="logout()" style="background: #dc3545; width: auto; padding: 10px 25px;">🚪 लॉग आउट</button>
        </div>
    </div>

    <footer>
        <p>Official WhatsApp: +91 8877490845</p>
    </footer>

    <script>
        const currentUserId = localStorage.getItem('currentUser');

        if (!currentUserId || !localStorage.getItem(currentUserId)) {
            alert('कृपया पहले लॉगिन करें!');
            window.location.href = 'login.html';
        } else {
            const userData = JSON.parse(localStorage.getItem(currentUserId));
            
            document.getElementById('cardName').innerText = userData.fullName;
            document.getElementById('cardId').innerText = `ID: ${userData.userId}`;
            document.getElementById('cardPlan').innerText = `Plan: ${userData.cardTier}`;
            
            if(userData.photo) {
                const img = document.getElementById('cardPhoto');
                img.src = userData.photo;
                img.style.display = 'inline-block';
            }

            const personalLink = `https://ioisplatform.github.io/register.html?ref=${userData.userId}`;
            document.getElementById('refLink').value = personalLink;

            const waText = encodeURIComponent(`🔥 IOIS Platform से जुड़ें!\nमात्र ₹10 में डिजिटल स्टार्टर किट प्राप्त करें और प्रति रेफर ₹7 तुरंत कमाएं!\nजॉइनिंग लिंक: ${personalLink}`);
            document.getElementById('waShareBtn').href = `https://api.whatsapp.com/send?text=${waText}`;
        }

        function copyLink() {
            var copyText = document.getElementById("refLink");
            copyText.select();
            document.execCommand("copy");
            alert("रेफरल लिंक कॉपी हो गया!");
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
