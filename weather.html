<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; min-height: 100vh; padding: 20px; }
        .weather-container { max-width: 450px; margin: auto; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
        .location-box { margin-bottom: 20px; text-align: center; }
        .location-box select { width: 100%; padding: 12px; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: #fff; font-size: 16px; outline: none; cursor: pointer; }
        .location-box select option { background: #2a5298; color: #fff; }
        
        /* Live Window View Animation */
        .window-view { position: relative; width: 100%; height: 220px; border-radius: 15px; overflow: hidden; background: #87CEEB; border: 4px solid rgba(255,255,255,0.4); box-shadow: inset 0 0 20px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; }
        
        /* Dynamic Weather Effects Inside Window */
        .sun { position: absolute; width: 50px; height: 50px; background: #ffeb3b; border-radius: 50%; top: 20px; right: 30px; box-shadow: 0 0 20px #ffeb3b; animation: pulse 3s infinite alternate; }
        .cloud { position: absolute; background: #fff; border-radius: 50px; width: 80px; height: 30px; top: 40px; left: 30px; animation: moveCloud 8s linear infinite; opacity: 0.8; }
        .rain { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(transparent, rgba(255,255,255,0.6)); animation: rainfall 0.5s linear infinite; display: none; }
        
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        @keyframes moveCloud { 0% { left: -90px; } 100% { left: 450px; } }
        @keyframes rainfall { 0% { background-position: 0 0; } 100% { background-position: 0 20px; } }

        .weather-info { text-align: center; margin-top: 20px; }
        .temp { font-size: 48px; font-weight: bold; margin-bottom: 5px; }
        .condition { font-size: 20px; margin-bottom: 15px; color: #ffeb3b; text-transform: uppercase; letter-spacing: 1px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .detail-card { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="weather-container">
    <div class="location-box">
        <label for="areaSelect" style="display:block; margin-bottom:8px; font-weight:600;">Select Local Area / City</label>
        <select id="areaSelect" onchange="updateWeatherView()">
            <option value="delhi">Delhi (Sunny / Clear)</option>
            <option value="mumbai">Mumbai (Rainy / Humid)</option>
            <option value="patna">Patna (Cloudy / Pleasant)</option>
            <option value="village">My Local Village / Rural Area</option>
        </select>
    </div>

    <!-- Live Window View -->
    <div class="window-view" id="windowFrame">
        <div class="sun" id="sunElement"></div>
        <div class="cloud" id="cloudElement"></div>
        <div class="rain" id="rainElement"></div>
        <div style="position: absolute; bottom: 10px; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 20px; font-size: 12px;">Live Window View Outside</div>
    </div>

    <div class="weather-info">
        <div class="temp" id="tempDisplay">32°C</div>
        <div class="condition" id="conditionDisplay">Sunny & Clear</div>
        <div class="details-grid">
            <div class="detail-card">Humidity: <span id="humidity">45%</span></div>
            <div class="detail-card">Wind: <span id="wind">12 km/h</span></div>
        </div>
    </div>
</div>

<script>
    function updateWeatherView() {
        const area = document.getElementById('areaSelect').value;
        const sun = document.getElementById('sunElement');
        const cloud = document.getElementById('cloudElement');
        const rain = document.getElementById('rainElement');
        const windowFrame = document.getElementById('windowFrame');
        const temp = document.getElementById('tempDisplay');
        const condition = document.getElementById('conditionDisplay');
        const humidity = document.getElementById('humidity');
        const wind = document.getElementById('wind');

        if(area === 'mumbai') {
            windowFrame.style.background = 'linear-gradient(135deg, #4b6cb4, #182848)';
            sun.style.display = 'none';
            cloud.style.display = 'block';
            rain.style.display = 'block';
            temp.innerText = '28°C';
            condition.innerText = 'Heavy Rain / Live View';
            humidity.innerText = '85%';
            wind.innerText = '22 km/h';
        } else if(area === 'patna') {
            windowFrame.style.background = 'linear-gradient(135deg, #757F9A, #D7DDE8)';
            sun.style.display = 'none';
            cloud.style.display = 'block';
            rain.style.display = 'none';
            temp.innerText = '30°C';
            condition.innerText = 'Cloudy Window View';
            humidity.innerText = '60%';
            wind.innerText = '15 km/h';
        } else {
            windowFrame.style.background = 'linear-gradient(135deg, #2980B9, #6DD5FA)';
            sun.style.display = 'block';
            cloud.style.display = 'block';
            rain.style.display = 'none';
            temp.innerText = '34°C';
            condition.innerText = 'Sunny & Clear View';
            humidity.innerText = '40%';
            wind.innerText = '10 km/h';
        }
    }
</script>

</body>
</html>
