<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS - पंचांग व राशिफल</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0f19; color: #fff; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #fbbf24; padding-bottom: 10px; }
        .header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fbbf24; }
        .header h2 { color: #fbbf24; font-size: 16px; }

        .box { background: #1e293b; border: 1px solid #fbbf24; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .box h3 { color: #38bdf8; margin-bottom: 10px; font-size: 15px; }
        
        select { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #fbbf24; font-size: 14px; margin-bottom: 10px; }
        .result-box { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 13px; color: #cbd5e1; margin-top: 10px; border-left: 4px solid #fbbf24; }

        .back-btn { display: block; text-align: center; background: #334155; color: #fff; text-decoration: none; padding: 10px; border-radius: 10px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Logo">
            <h2>IOIS - पंचांग व दैनिक राशिफल</h2>
        </div>

        <div class="box">
            <h3>📅 आज का पंचांग</h3>
            <p style="font-size: 13px; line-height: 1.6;">
                <strong>तिथि:</strong> शुक्ल पक्ष एकादशी<br>
                <strong>नक्षत्र:</strong> रोहिणी<br>
                <strong>शुभ मुहूर्त:</strong> सुबह 11:45 से दोपहर 12:35 तक<br>
                <strong>राहुकाल:</strong> दोपहर 01:30 से 03:00 तक
            </p>
        </div>

        <div class="box">
            <h3>✨ अपनी राशि चुनें और सटीक राशिफल जानें</h3>
            <select id="rashiSelect" onchange="showRashifal()">
                <option value="">-- अपनी राशि चुनें --</option>
                <option value="मेष">मेष (Aries)</option>
                <option value="वृषभ">वृषभ (Taurus)</option>
                <option value="मिथुन">मिथुन (Gemini)</option>
                <option value="कर्क">कर्क (Cancer)</option>
                <option value="सिंह">सिंह (Leo)</option>
                <option value="कन्या">कन्या (Virgo)</option>
                <option value="तुला">तुला (Libra)</option>
                <option value="वृश्चिक">वृश्चिक (Scorpio)</option>
                <option value="धनु">धनु (Sagittarius)</option>
                <option value="मकर">मकर (Capricorn)</option>
                <option value="कुंभ">कुंभ (Aquarius)</option>
                <option value="मीन">मीन (Pisces)</option>
            </select>
            <div class="result-box" id="rashifalResult">कृपया ऊपर दी गई सूची से अपनी राशि चुनें।</div>
        </div>

        <a href="index.html" class="back-btn">🏠 होम पेज पर वापस जाएं</a>
    </div>

    <script>
        function showRashifal() {
            const rashi = document.getElementById('rashiSelect').value;
            const res = document.getElementById('rashifalResult');
            if(!rashi) {
                res.innerHTML = "कृपया अपनी राशि चुनें।";
                return;
            }
            
            const predictions = {
                "मेष": "आज धन लाभ के योग बन रहे हैं। परिवार में खुशहाली रहेगी और कार्यक्षेत्र में सफलता मिलेगी।",
                "वृषभ": "व्यापार में नए अवसर मिलेंगे। सेहत का ध्यान रखें और अनजान लोगों पर ज्यादा भरोसा न करें.",
                "मिथुन": "विद्यार्थियों के लिए दिन उत्तम है। रुका हुआ पैसा वापस मिल सकता है.",
                "कर्क": "मानसिक शांति बनी रहेगी। मित्रों का पूरा सहयोग मिलेगा, यात्रा टालें।",
                "सिंह": "आत्मविश्वास में वृद्धि होगी। ऑफिस में ओथोरिटी बढ़ेगी, दिन शानदार है।",
                "कन्या": "खर्चों पर नियंत्रण रखें। परिवार के साथ धार्मिक स्थल की यात्रा हो सकती है।",
                "तुला": "सफलता आपके कदम चूमेगी। ऑनलाइन बिजनेस या कार्यों में विशेष लाभ मिलेगा।",
                "वृश्चिक": "छुपकर विरोध करने वालों से सावधान रहें। धैर्य से काम लें, समय अनुकूल होगा।",
                "धनु": "भाग्य का पूरा साथ मिलेगा। नई नौकरी या प्रोजेक्ट की शुरुआत के लिए बेहतरीन दिन है।",
                "मकर": "कार्यभार अधिक हो सकता है। सेहत का ख्याल रखें, मेहनत का फल अवश्य मिलेगा।",
                "कुंभ": "आय के नए स्रोत खुलेंगे। वैवाहिक जीवन सुखमय रहेगा और मित्रों से भेंट होगी।",
                "मीन": "मन प्रसन्न रहेगा। रचनात्मक कार्यों में रुचि बढ़ेगी और पुराना अटका काम पूरा होगा।"
            };
            
            res.innerHTML = `<strong>${rashi} राशि का आज का राशिफल:</strong><br>${predictions[rashi]}`;
        }
    </script>
</body>
</html>
